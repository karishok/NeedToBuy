services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: needtobuy
      POSTGRES_PASSWORD: needtobuy
      POSTGRES_DB: needtobuy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needtobuy"]
      interval: 2s
      timeout: 2s
      retries: 15

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080" # web UI to read caught OTP mail
      - "1025:1025" # SMTP_ADDR default points here

volumes:
  pgdata:
