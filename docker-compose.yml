services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: needtobuy
      POSTGRES_PASSWORD: needtobuy
      POSTGRES_DB: needtobuy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needtobuy"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
